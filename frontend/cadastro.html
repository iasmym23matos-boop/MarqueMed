<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarqueMed</title>
    <link rel="stylesheet" href="css/stylesheet.css"> 
</head>
<body>

 <div class="container">

    <h1>Cadastro do Paciente</h1>

    <div class="grupo">
        <label>Nome</label> 
        <input type="text" id="nome" placeholder="Digite o nome">
    </div>

    <div class="grupo">
        <label>Email</label>
        <input type="email" id="email" placeholder="Digite o email">
    </div>

    <div class="linha">
        <div class="grupo">
            <label>Senha</label>
            <input type="password" id="senha" placeholder="Senha">
        </div>

        <div class="grupo">
            <label>ID do paciente</label>
            <input type="number" id="matricula" placeholder="Matrícula">
        </div>
    </div>

    <div class="linha">
        <div class="grupo">
            <label>CPF</label>
            <input type="text" id="cpf" placeholder="Digite o CPF">
        </div>

        <div class="grupo">
            <label>CEP</label>
            <input type="text" id="cep" placeholder="Digite o CEP">
        </div>

        <div class="grupo" style="display:flex; align-items:end;">
            <button onclick="buscarCep()">Buscar CEP</button>
        </div>
    </div>

    <div class="linha">
        <div class="grupo">
            <label>Logradouro</label>
            <input type="text" id="logradouro" placeholder="Rua, Av...">
        </div>
        <div class="grupo">
            <label>Bairro</label>
            <input type="text" id="bairro" placeholder="Bairro">
        </div>
    </div>

    <div class="linha">
        <div class="grupo">
            <label>Cidade</label>
            <input type="text" id="cidade">
        </div>

        <div class="grupo">
            <label>Estado</label>
            <input type="text" id="estado">
        </div>

        <div class="grupo">
            <label>Data de Nascimento</label>
            <input type="date" id="data_de_nascimento">
        </div> 
    </div>

    <button onclick="cadastrar()">Cadastrar</button>

    <div id="links-login">
        <a href="#">Esqueci minha senha</a>
        <a href="login.html">Login</a>
    </div>

    <p id="msg"></p>

 </div>

<script>
// =========================
// BUSCAR CEP (CORRIGIDO COM AS ASPAS MAIS SEGURAS)
// =========================
function buscarCep() {
    let cep = document.getElementById("cep").value.replace(/\D/g, '');
    document.getElementById("msg").innerText = "";

    if (cep.length !== 8) {
        document.getElementById("msg").className = "erro";
        document.getElementById("msg").innerText = "Por favor, digite um CEP válido com 8 números.";
        return;
    }

    fetch("https://viacep.com.br/ws/" + cep + "/json/")

        .then(function(res) { 
            return res.json(); 
        })
        .then(function(data) {
            if (data.erro) {
                document.getElementById("msg").className = "erro";
                document.getElementById("msg").innerText = "CEP não encontrado.";
                return;
            }
            document.getElementById("logradouro").value = data.logradouro || "";
            document.getElementById("bairro").value = data.bairro || "";
            document.getElementById("cidade").value = data.localidade || "";
            document.getElementById("estado").value = data.uf || "";
        })
        .catch(function(err) {
            document.getElementById("msg").className = "erro";
            document.getElementById("msg").innerText = "Erro ao buscar o CEP.";
        });
}

// =========================
// CADASTRAR
// =========================
function cadastrar() {
    const dadosPaciente = {
        nome: document.getElementById("nome").value,
        email: document.getElementById("email").value,
        senha: document.getElementById("senha").value,
        matricula: document.getElementById("matricula").value,
        cpf: document.getElementById("cpf").value,
        cep: document.getElementById("cep").value,
        logradouro: document.getElementById("logradouro").value,
        bairro: document.getElementById("bairro").value,
        cidade: document.getElementById("cidade").value,
        estado: document.getElementById("estado").value,
        data_nascimento: document.getElementById("data_de_nascimento").value
    };

    if (!dadosPaciente.nome || !dadosPaciente.email || !dadosPaciente.senha) {
        document.getElementById("msg").className = "erro";
        document.getElementById("msg").innerText = "Por favor, preencha os campos obrigatórios (Nome, Email e Senha).";
        return;
    }

    fetch("http://localhost:8000/pacientes", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(dadosPaciente)
    })
    .then(function(res) {
        if (res.ok) {
            return res.json();
        }
        throw new Error("Erro ao salvar cadastro.");
    })
    .then(function(data) {
        document.getElementById("msg").className = "sucesso";
        document.getElementById("msg").innerText = "Paciente cadastrado com sucesso!";
    })
    .catch(function(err) {
        document.getElementById("msg").className = "erro";
        document.getElementById("msg").innerText = "Erro ao conectar com o servidor.";
    });
}
</script>
</body>
</html>
